<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelBloom | Contact Us</title>
    <link rel="stylesheet" href="travel_recommendation.css">
</head>
<body class="page">

    <nav class="navbar">
        <a href="index.html" class="logo">TravelBloom</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about_us.html">About Us</a></li>
            <li><a href="contact_us.html" class="active">Contact Us</a></li>
        </ul>
    </nav>

    <main class="content">
        <section class="contact">
            <h1>Contact Us</h1>
            <p>Have a question or want help planning your trip? Send us a message.</p>
            <div class="contact-info">
                <p><strong>Email:</strong> support@travelbloom.example</p>
                <p><strong>Office:</strong> Chennai, Tamil Nadu, India</p>
                <p><strong>Hours:</strong> Monday to Friday, 10:00 AM – 6:00 PM IST</p>
            </div>

            <form id="contactForm" class="contact-form">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6" placeholder="Enter your message" required></textarea>

                <button type="submit">Submit</button>
            </form>
            <p id="formStatus" class="form-status"></p>
        </section>
    </main>

    <script>
        document.getElementById("contactForm").addEventListener("submit", function (event) {
            event.preventDefault();
            const name = document.getElementById("name").value.trim();
            document.getElementById("formStatus").textContent =
                "Thank you, " + name + "! Your message has been received.";
            this.reset();
        });
    </script>
</body>
</html>
